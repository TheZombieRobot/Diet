org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# "Continue with Facebook" (docs/FACEBOOK.md). Both are public by design: the App ID and
# client token are embedded in every copy of the app. NEVER put the Meta App Secret here.
moshpoint.fb.appId=
moshpoint.fb.clientToken=

# Relay server for GPS finding and photo sharing (README: "Deploy the relay server").
# Empty = GPS off. A MOSHPOINT_SERVER Actions variable wins when set.
moshpoint.serverUrl=

# Gig search keys (Ticketmaster, SeatGeek, Bandsintown) never go here or anywhere in the repo:
# they are the relay server's secrets (`fly secrets set`, docs/SECRETS.md).

# The privacy policy the app links to (onboarding, the location disclosure, Settings) in builds
# WITHOUT a relay of their own. Builds with one link to the relay's own page, https://<relay>/privacy
# (app/build.gradle.kts), which is also the address for Play Console and Meta (docs/PLAY_STORE.md).
# A commit permalink (the policy as of the launch prep, docs/LAUNCH_PREP.md item 2), which stays put
# when branches are renamed or deleted, unlike a branch link: point it at a newer commit when
# PRIVACY.md changes.
moshpoint.privacyUrl=https://github.com/TheZombieRobot/Diet/blob/9773f19d7cb3e1d6169836211f8473407ab82ccb/docs/PRIVACY.md
