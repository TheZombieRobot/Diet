org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# "Continue with Facebook" (docs/FACEBOOK.md). Both are public by design: the App ID and
# client token are embedded in every copy of the app. NEVER put the Meta App Secret here.
moshpoint.fb.appId=
moshpoint.fb.clientToken=

# Relay server for GPS finding and photo sharing (README: "Deploy the relay server").
# Empty = GPS off. A MOSHPOINT_SERVER Actions variable wins when set.
moshpoint.serverUrl=
