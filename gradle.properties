org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# "Continue with Facebook" (docs/FACEBOOK.md). Both are public by design: the App ID and
# client token are embedded in every copy of the app. NEVER put the Meta App Secret here.
moshpoint.fb.appId=
moshpoint.fb.clientToken=

# Relay server for GPS finding and photo sharing (README: "Deploy the relay server").
# Empty = GPS off. A MOSHPOINT_SERVER Actions variable wins when set.
moshpoint.serverUrl=

# Gig search: a free Ticketmaster Discovery API key (developer.ticketmaster.com -> My Apps ->
# Consumer Key). Leave empty to type gigs in by hand.
moshpoint.tm.key=

# The privacy policy the app links to (onboarding, the location disclosure, Settings) and the one
# Play Console and Meta need. A placeholder until it's hosted at a stable address of its own
# (docs/PLAY_STORE.md): change it here, and the app follows on its next build.
moshpoint.privacyUrl=https://github.com/TheZombieRobot/Diet/blob/ccr-5839ed7c-1q0ztj/docs/PRIVACY.md
