org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# "Continue with Facebook" (docs/FACEBOOK.md). Both are public by design: the App ID and
# client token are embedded in every copy of the app. NEVER put the Meta App Secret here.
moshpoint.fb.appId=
moshpoint.fb.clientToken=

# Relay server for GPS finding and photo sharing (README: "Deploy the relay server").
# Empty = GPS off. A MOSHPOINT_SERVER Actions variable wins when set.
moshpoint.serverUrl=

# Gig search keys (Ticketmaster, SeatGeek, Bandsintown) never go here or anywhere in the repo:
# they are the relay server's secrets (`fly secrets set`, docs/SECRETS.md).

# The privacy policy the app links to (onboarding, the location disclosure, Settings) and the one
# Play Console and Meta need. A placeholder until the owner hosts it at a stable address of its
# own (docs/PLAY_STORE.md): change it here, and the app follows on its next build. Until then it's
# a commit permalink (the policy as of wave 2b), which stays put when branches are renamed or
# deleted, unlike a branch link.
moshpoint.privacyUrl=https://github.com/TheZombieRobot/Diet/blob/8b81317b43db8b994bf68471d0cf5d6503254f44/docs/PRIVACY.md
