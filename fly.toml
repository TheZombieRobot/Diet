# Fly.io config for the Moshpoint relay server.
# Deploy steps, sizes and costs: docs/SERVER_PRODUCTION.md. In short, from the repo root:
#   fly apps create moshpoint-relay
#   fly secrets set MOSHPOINT_TOKEN_SECRET=$(openssl rand -hex 32) MOSHPOINT_CONTACT=you@example.org
#   fly deploy --ha=false        # ONE Machine: a second one would get its own, empty volume
#   fly scale count 1            # if a second Machine was ever created
# Then set the repo variable MOSHPOINT_SERVER to https://<app-name>.fly.dev
app = "moshpoint-relay"
primary_region = "syd" # closest to NZ

# A stop (deploy, restart, resize) sends SIGTERM: the relay finishes requests in flight, then
# flushes and closes its database before the Machine stops.
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "server/Dockerfile"

[env]
  DATA_DIR = "/data"
  # Client addresses come from Fly-Client-IP, which Fly's proxy sets (and the app's port is
  # only reachable through it). The relay assumes this whenever FLY_APP_NAME is set anyway.
  TRUST_PROXY = "fly"

# Everything the relay accepts lives on this volume: SQLite for the mailboxes, files for moments
# and profile photos. The relay refuses to start on Fly if the volume isn't mounted here.
[mounts]
  source = "moshpoint_data"
  destination = "/data"
  initial_size = "20gb"
  # Grows by itself before it fills (byte caps follow its size at the next start).
  auto_extend_size_threshold = 80
  auto_extend_size_increment = "5GB"
  auto_extend_size_limit = "60GB"
  # Fly's daily snapshot of the volume, kept one day (encrypted data only; see the privacy note
  # in docs/SERVER_PRODUCTION.md).
  snapshot_retention = 1

[http_service]
  internal_port = 8080
  force_https = true
  # Always on. A stopped Machine starts again on the next request, but phones are told a message
  # is sent once the relay has it: the relay must be up to hand it on, and to answer in time.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  # One Machine answers everyone. Fly's default (25 connections) would turn a crowd away.
  [http_service.concurrency]
    type = "requests"
    soft_limit = 1500
    hard_limit = 3000

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

# Testing and a small launch: about US$7 a month (plus the volume). For festival crowds, change to
# size = "performance-1x" and memory = "2gb" (about US$33 a month) and deploy; the heap follows
# the memory by itself. Sizes and costs: docs/SERVER_PRODUCTION.md.
[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
