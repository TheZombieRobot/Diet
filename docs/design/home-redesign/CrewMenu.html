<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Crew menu</title>
<style>
@font-face{font-family:Inter;font-weight:400;src:url(../../../app/src/main/res/font/inter_regular.ttf)}
@font-face{font-family:Inter;font-weight:500;src:url(../../../app/src/main/res/font/inter_medium.ttf)}
@font-face{font-family:Inter;font-weight:600 700;src:url(../../../app/src/main/res/font/inter_semibold.ttf)}
@font-face{font-family:Unbounded;font-weight:700;src:url(../../../app/src/main/res/font/unbounded_bold.ttf)}
@font-face{font-family:Unbounded;font-weight:800;src:url(../../../app/src/main/res/font/unbounded_extrabold.ttf)}
@font-face{font-family:'Permanent Marker';src:url(../../../app/src/main/res/font/permanent_marker.ttf)}

body{margin:0;background:#07050F}
a{color:#22E4FF}a:hover{color:#B6FF3B}
button{font:inherit}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: radial-gradient(70% 40% at 0% 8%, rgba(34,228,255,0.10), transparent 70%), #07050F; color: #F7F5FF; font-family: Inter, system-ui, -apple-system, sans-serif;">

<div aria-hidden="true" style="padding: 52px 24px 0; display: flex; flex-direction: column;">
<p style="margin: 0; font-family: Unbounded, 'Arial Black', sans-serif; font-weight: 800; font-size: 26px; letter-spacing: -0.5px;">mosh<span style="color: #FF2E93;">point</span></p>
<p style="margin: 58px 0 0; font-size: 11.5px; font-weight: 600; letter-spacing: 2.5px; color: #8E87A6;">TONIGHT</p>
<p style="margin: 4px 0 0; font-family: Unbounded, 'Arial Black', sans-serif; font-weight: 800; font-size: 28px;">Sam's crew</p>
<div style="display: flex; gap: 14px; margin-top: 34px;">
<img src="faces/rae.png" alt="" style="width: 70px; height: 70px; border-radius: 50%; box-shadow: 0 0 0 3px #B6FF3B;">
<img src="faces/sam.png" alt="" style="width: 70px; height: 70px; border-radius: 50%; box-shadow: 0 0 0 3px #B6FF3B;">
<img src="faces/alex.png" alt="" style="width: 70px; height: 70px; border-radius: 50%; box-shadow: 0 0 0 3px #B6FF3B;">
<img src="faces/jo.png" alt="" style="width: 70px; height: 70px; border-radius: 50%; filter: saturate(0.5) brightness(0.75);">
</div>
<div style="margin-top: 70px; height: 64px; border-radius: 20px; background: linear-gradient(90deg, #FF2E93, #9D5CFF 55%, #22E4FF);"></div>
</div>

<div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(3,2,8,0.66);"></div>

<div role="dialog" aria-label="Sam's crew" style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 12px 24px 34px; border-radius: 28px 28px 0 0; background: #120E22; border-top: 1px solid rgba(255,255,255,0.10); display: flex; flex-direction: column;">
<span aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: rgba(255,255,255,0.25);"></span>
<div style="display: flex; flex-direction: column; gap: 4px; margin-top: 18px;">
<h2 style="margin: 0; font-family: Unbounded, 'Arial Black', sans-serif; font-weight: 800; font-size: 22px;">Sam's crew</h2>
<p style="margin: 0; font-size: 13px; color: #8E87A6;">Tonight · 5 in the crew</p>
</div>

<div style="display: flex; flex-direction: column; margin-top: 16px;">
<button type="button" style="display: flex; align-items: center; gap: 14px; padding: 12px 0; border: 0; background: none; color: #F7F5FF; text-align: left; cursor: pointer;">
<span style="flex: none; width: 44px; height: 44px; border-radius: 14px; background: rgba(34,228,255,0.13); color: #22E4FF; display: flex; align-items: center; justify-content: center;"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="8" r="3.5"></circle><path d="M3.5 20a6.5 6.5 0 0 1 13 0"></path><path d="M19 8v6M16 11h6"></path></svg></span>
<span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 3px;"><span style="font-size: 16px; font-weight: 600;">Invite more mates</span><span style="font-size: 13px; color: #8E87A6;">Show the crew QR, or send a link</span></span>
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8E87A6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex: none;"><path d="M9 6l6 6-6 6"></path></svg>
</button>
<button type="button" style="display: flex; align-items: center; gap: 14px; padding: 12px 0; border: 0; background: none; color: #F7F5FF; text-align: left; cursor: pointer;">
<span style="flex: none; width: 44px; height: 44px; border-radius: 14px; background: rgba(157,92,255,0.16); color: #C9A8FF; display: flex; align-items: center; justify-content: center;"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-6 8 6v9H4z"></path><path d="M10 20v-5h4v5"></path></svg></span>
<span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 3px;"><span style="font-size: 16px; font-weight: 600;">Share the night with family</span><span style="font-size: 13px; color: #8E87A6;">They follow along from home and can't be found</span></span>
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8E87A6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex: none;"><path d="M9 6l6 6-6 6"></path></svg>
</button>
<span aria-hidden="true" style="height: 1px; margin: 8px 0; background: rgba(255,255,255,0.08);"></span>
<button type="button" style="display: flex; align-items: center; gap: 14px; padding: 12px 0; border: 0; background: none; color: #FF6FB3; text-align: left; cursor: pointer;">
<span style="flex: none; width: 44px; height: 44px; border-radius: 14px; background: rgba(255,46,147,0.12); color: #FF6FB3; display: flex; align-items: center; justify-content: center;"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v8"></path><path d="M6.6 7.4a7.5 7.5 0 1 0 10.8 0"></path></svg></span>
<span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 3px;"><span style="font-size: 16px; font-weight: 600;">End the night</span><span style="font-size: 13px; color: #8E87A6;">Leave tonight's crew. Your photos stay in Past gigs</span></span>
</button>
</div>
</div>
</div>
</body>
</html>
