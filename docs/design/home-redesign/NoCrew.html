<body>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: radial-gradient(70% 40% at 100% 30%, rgba(255,46,147,0.12), transparent 70%), radial-gradient(70% 45% at 0% 90%, rgba(34,228,255,0.09), transparent 70%), #07050F; color: #F7F5FF; font-family: Inter, system-ui, -apple-system, sans-serif;">

<div style="padding: 52px 24px 0; display: flex; flex-direction: column;">
<div style="display: flex; align-items: center; justify-content: space-between;">
<p style="margin: 0; font-family: Unbounded, 'Arial Black', sans-serif; font-weight: 800; font-size: 26px; letter-spacing: -0.5px;">mosh<span style="color: #FF2E93; text-shadow: 0 0 18px rgba(255,46,147,0.55);">point</span></p>
<button type="button" style="display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid rgba(255,111,179,0.45); background: rgba(255,46,147,0.08); color: #FF6FB3; font-size: 14px; font-weight: 600; cursor: pointer;"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7.5v5.5"></path><path d="M12 16.5h.01"></path></svg>Need help</button>
</div>
<div style="display: flex; align-items: center; gap: 10px; margin-top: 12px;">
<span style="font-family: Unbounded, 'Arial Black', sans-serif; font-weight: 700; font-size: 15px; color: #B6FF3B;">Live</span>
<button type="button" aria-pressed="true" aria-label="Live" style="position: relative; width: 46px; height: 28px; border-radius: 14px; border: 0; padding: 0; background: #B6FF3B; box-shadow: 0 0 14px rgba(182,255,59,0.45); cursor: pointer;"><span style="position: absolute; top: 3px; right: 3px; width: 22px; height: 22px; border-radius: 50%; background: #07050F;"></span></button>
<span style="font-size: 13.5px; color: #D9D4EC;">You're visible to your mates</span>

<h1 style="margin: 34px 0 0; font-family: Unbounded, 'Arial Black', sans-serif; font-weight: 800; font-size: 30px; letter-spacing: -0.5px; line-height: 1.1;">No crew tonight</h1>
<p style="margin: 10px 0 0; font-size: 15px; line-height: 1.5; color: #D9D4EC;">Start one, show your mates the QR code, and you're a crew.</p>

<button type="button" style="margin-top: 24px; height: 64px; border-radius: 20px; border: 0; display: flex; align-items: center; justify-content: center; gap: 12px; background: linear-gradient(90deg, #FF2E93, #9D5CFF 55%, #22E4FF); box-shadow: 0 16px 40px -14px rgba(255,46,147,0.65); color: #FFFFFF; font-family: Unbounded, 'Arial Black', sans-serif; font-weight: 700; font-size: 17px; cursor: pointer;"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="8" r="3.5"></circle><path d="M3.5 20a6.5 6.5 0 0 1 13 0"></path><path d="M19 8v6M16 11h6"></path></svg>Start a crew for tonight</button>

<button type="button" style="margin-top: 12px; height: 64px; border-radius: 18px; border: 1px solid rgba(255,255,255,0.10); background: rgba(255,255,255,0.06); color: #F7F5FF; display: flex; align-items: center; gap: 14px; padding: 0 16px; text-align: left; cursor: pointer;">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#C9A8FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: none;"><rect x="4" y="5.5" width="16" height="14.5" rx="2"></rect><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4"></path></svg>
<span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 15px; font-weight: 600;">Plan a gig</span><span style="font-size: 13px; color: #8E87A6;">Find it now and invite your mates</span></span>
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8E87A6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex: none;"><path d="M9 6l6 6-6 6"></path></svg>
</button>

<p style="margin: 28px 0 0; font-size: 11.5px; font-weight: 600; letter-spacing: 2.5px; color: #8E87A6;">JOIN A CREW</p>
<div style="display: flex; gap: 12px; margin-top: 10px;">
<button type="button" style="flex: 1 1 0; min-width: 0; height: 52px; border-radius: 16px; border: 1px solid rgba(34,228,255,0.30); background: rgba(34,228,255,0.07); color: #22E4FF; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 600; cursor: pointer;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V5h4M20 9V5h-4M4 15v4h4M20 15v4h-4"></path><path d="M8 12h8"></path></svg>Scan QR code</button>
<button type="button" style="flex: 1 1 0; min-width: 0; height: 52px; border-radius: 16px; border: 1px solid rgba(34,228,255,0.30); background: rgba(34,228,255,0.07); color: #22E4FF; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 600; cursor: pointer;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"></path><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"></path></svg>Paste invite</button>
</div>

<h2 style="margin: 30px 0 0; font-family: Unbounded, 'Arial Black', sans-serif; font-weight: 800; font-size: 20px;">Up next</h2>
<a href="#" style="margin-top: 12px; display: flex; align-items: center; gap: 14px; padding: 12px 0; text-decoration: none; color: #F7F5FF; border-top: 1px solid rgba(255,255,255,0.08); border-bottom: 1px solid rgba(255,255,255,0.08);">
<span style="flex: none; width: 46px; height: 50px; border-radius: 12px; background: rgba(157,92,255,0.16); border: 1px solid rgba(157,92,255,0.35); display: flex; flex-direction: column; align-items: center; justify-content: center;"><span style="font-size: 10px; font-weight: 700; letter-spacing: 1px; color: #C9A8FF;">SAT</span><span style="font-family: Unbounded, 'Arial Black', sans-serif; font-weight: 800; font-size: 17px; line-height: 1.1;">21</span></span>
<span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 3px;"><span style="font-size: 15px; font-weight: 600;">Summer Fields crew</span><span style="font-size: 13px; color: #8E87A6;">4 mates · wakes up on the day</span></span>
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8E87A6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex: none;"><path d="M9 6l6 6-6 6"></path></svg>
</a>

<div style="display: flex; align-items: baseline; justify-content: space-between; margin-top: 28px;">
<h2 style="margin: 0; font-family: Unbounded, 'Arial Black', sans-serif; font-weight: 800; font-size: 20px;">Past gigs</h2>
<a href="#" style="font-size: 14px; font-weight: 600; color: #22E4FF; text-decoration: none;">See all</a>
</div>
<div style="display: flex; gap: 14px; margin: 14px -24px 0 0; overflow: hidden;">
<div style="flex: none; width: 150px; height: 120px; border-radius: 4px; background: radial-gradient(circle at 28% 18%, rgba(255,46,147,0.95), transparent 42%), radial-gradient(circle at 76% 12%, rgba(34,228,255,0.85), transparent 36%), linear-gradient(#24123d, #07050F); border: 9px solid #F5F1E8; border-bottom: 0; transform: rotate(-2deg);"></div>

<a href="#" style="width: 64px; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #D9D4EC; text-decoration: none; font-size: 11.5px; font-weight: 500;"><img src="faces/me.png" alt="" style="display: block; width: 26px; height: 26px; border-radius: 50%;">Me</a>
