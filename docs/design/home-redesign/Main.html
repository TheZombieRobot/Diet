<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Crew tonight</title>
<style>
@font-face{font-family:Inter;font-weight:400;src:url(../../../app/src/main/res/font/inter_regular.ttf)}
@font-face{font-family:Inter;font-weight:500;src:url(../../../app/src/main/res/font/inter_medium.ttf)}
@font-face{font-family:Inter;font-weight:600 700;src:url(../../../app/src/main/res/font/inter_semibold.ttf)}
@font-face{font-family:Unbounded;font-weight:700;src:url(../../../app/src/main/res/font/unbounded_bold.ttf)}
@font-face{font-family:Unbounded;font-weight:800;src:url(../../../app/src/main/res/font/unbounded_extrabold.ttf)}
@font-face{font-family:'Permanent Marker';src:url(../../../app/src/main/res/font/permanent_marker.ttf)}

body{margin:0;background:#07050F}
a{color:#22E4FF}a:hover{color:#B6FF3B}
button{font:inherit}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: radial-gradient(70% 40% at 0% 8%, rgba(34,228,255,0.10), transparent 70%), radial-gradient(70% 45% at 100% 100%, rgba(255,46,147,0.13), transparent 70%), #07050F; color: #F7F5FF; font-family: Inter, system-ui, -apple-system, sans-serif;">

<div style="padding: 52px 24px 0; display: flex; flex-direction: column;">
<div style="display: flex; align-items: center; justify-content: space-between;">
<p style="margin: 0; font-family: Unbounded, 'Arial Black', sans-serif; font-weight: 800; font-size: 26px; letter-spacing: -0.5px; color: #F7F5FF;">mosh<span style="color: #FF2E93; text-shadow: 0 0 18px rgba(255,46,147,0.55);">point</span></p>
<button type="button" style="display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid rgba(255,111,179,0.45); background: rgba(255,46,147,0.08); color: #FF6FB3; font-size: 14px; font-weight: 600; cursor: pointer;"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7.5v5.5"></path><path d="M12 16.5h.01"></path></svg>Need help</button>
</div>

<div style="display: flex; align-items: center; gap: 10px; margin-top: 12px;">
<span style="font-family: Unbounded, 'Arial Black', sans-serif; font-weight: 700; font-size: 15px; color: #B6FF3B;">Live</span>
<button type="button" aria-pressed="true" aria-label="Live" style="position: relative; width: 46px; height: 28px; border-radius: 14px; border: 0; padding: 0; background: #B6FF3B; box-shadow: 0 0 14px rgba(182,255,59,0.45); cursor: pointer;"><span style="position: absolute; top: 3px; right: 3px; width: 22px; height: 22px; border-radius: 50%; background: #07050F;"></span></button>
<span style="font-size: 13.5px; color: #D9D4EC;">You're visible to your mates</span>
</div>

<div style="display: flex; flex-direction: column; gap: 4px; margin-top: 30px;">
<p style="margin: 0; font-size: 11.5px; font-weight: 600; letter-spacing: 2.5px; color: #8E87A6;">TONIGHT</p>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
<h1 style="margin: 0; font-family: Unbounded, 'Arial Black', sans-serif; font-weight: 800; font-size: 28px; letter-spacing: -0.5px; line-height: 1.1;">Sam's crew</h1>
<button type="button" aria-label="Crew options" style="flex: none; width: 44px; height: 44px; border-radius: 22px; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.06); color: #F7F5FF; display: flex; align-items: center; justify-content: center; cursor: pointer;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="19" cy="12" r="2"></circle></svg></button>
</div>
<p style="margin: 0; font-size: 13px; color: #8E87A6;">5 in the crew · 3 live</p>
</div>

<div style="display: flex; gap: 14px; margin: 20px -24px 0 0; overflow: hidden;">
<div style="flex: none; width: 70px; display: flex; flex-direction: column; align-items: center; gap: 6px;">
<img src="faces/rae.png" alt="Rae" style="display: block; width: 70px; height: 70px; border-radius: 50%; box-shadow: 0 0 0 3px #B6FF3B, 0 0 20px 2px rgba(182,255,59,0.45);">
<span style="margin-top: 4px; font-size: 14px; font-weight: 600;">Rae</span>
<span style="font-family: Unbounded, 'Arial Black', sans-serif; font-weight: 700; font-size: 15px; color: #B6FF3B;">8 m</span>
</div>
<div style="flex: none; width: 70px; display: flex; flex-direction: column; align-items: center; gap: 6px;">
<img src="faces/sam.png" alt="Sam" style="display: block; width: 70px; height: 70px; border-radius: 50%; box-shadow: 0 0 0 3px #B6FF3B, 0 0 20px 2px rgba(182,255,59,0.45);">
<span style="margin-top: 4px; font-size: 14px; font-weight: 600;">Sam</span>
<span style="font-family: Unbounded, 'Arial Black', sans-serif; font-weight: 700; font-size: 15px; color: #B6FF3B;">40 m</span>
</div>
<div style="flex: none; width: 70px; display: flex; flex-direction: column; align-items: center; gap: 6px;">
<img src="faces/alex.png" alt="Alex" style="display: block; width: 70px; height: 70px; border-radius: 50%; box-shadow: 0 0 0 3px #B6FF3B, 0 0 20px 2px rgba(182,255,59,0.45);">
<span style="margin-top: 4px; font-size: 14px; font-weight: 600;">Alex</span>
<span style="font-family: Unbounded, 'Arial Black', sans-serif; font-weight: 700; font-size: 15px; color: #B6FF3B;">120 m</span>
</div>
<div style="flex: none; width: 70px; display: flex; flex-direction: column; align-items: center; gap: 6px;">
<img src="faces/jo.png" alt="Jo" style="display: block; width: 70px; height: 70px; border-radius: 50%; box-shadow: 0 0 0 2px rgba(255,255,255,0.12); filter: saturate(0.5) brightness(0.75);">
<span style="margin-top: 4px; font-size: 14px; font-weight: 600; color: #D9D4EC;">Jo</span>
<span style="font-size: 12.5px; color: #8E87A6;">15 min ago</span>
</div>
<div style="flex: none; width: 70px; display: flex; flex-direction: column; align-items: center; gap: 6px;">
<img src="faces/kai.png" alt="Kai" style="display: block; width: 70px; height: 70px; border-radius: 50%; box-shadow: 0 0 0 2px rgba(255,255,255,0.12); filter: saturate(0.5) brightness(0.75);">
<span style="margin-top: 4px; font-size: 14px; font-weight: 600; color: #D9D4EC;">Kai</span>
<span style="font-size: 12.5px; color: #8E87A6;">1 h ago</span>
</div>
</div>

<button type="button" style="margin-top: 26px; height: 64px; border-radius: 20px; border: 0; display: flex; align-items: center; justify-content: center; gap: 12px; background: linear-gradient(90deg, #FF2E93, #9D5CFF 55%, #22E4FF); box-shadow: 0 16px 40px -14px rgba(255,46,147,0.65); color: #FFFFFF; font-family: Unbounded, 'Arial Black', sans-serif; font-weight: 700; font-size: 18px; cursor: pointer;"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l16-7-7 16-2-7z"></path></svg>Find everyone</button>

<div style="display: flex; gap: 12px; margin-top: 14px;">
<button type="button" style="flex: 1 1 0; min-width: 0; height: 56px; border-radius: 18px; border: 1px solid rgba(255,255,255,0.10); background: rgba(255,255,255,0.06); color: #F7F5FF; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 15px; font-weight: 600; cursor: pointer;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"></path></svg>Crew chat<span style="min-width: 22px; height: 22px; padding: 0 6px; box-sizing: border-box; border-radius: 11px; background: #FF2E93; color: #FFFFFF; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center;">3</span></button>
<button type="button" style="flex: 1 1 0; min-width: 0; height: 56px; border-radius: 18px; border: 1px solid rgba(255,255,255,0.10); background: rgba(255,255,255,0.06); color: #F7F5FF; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 15px; font-weight: 600; cursor: pointer;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>Share photos</button>
</div>

<div style="display: flex; align-items: flex-start; gap: 12px; margin-top: 20px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.08);">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FF2E93" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex: none; margin-top: 1px;"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg>
<div style="display: flex; flex-direction: column; gap: 3px;">
<span style="font-size: 15px; font-weight: 600;">Meet-up: sound desk</span>
<span style="font-size: 13px; color: #D9D4EC;">Alex is on their way · 2 min ago</span>
</div>
</div>

<div style="display: flex; align-items: baseline; justify-content: space-between; margin-top: 30px;">
<h2 style="margin: 0; font-family: Unbounded, 'Arial Black', sans-serif; font-weight: 800; font-size: 20px;">Past gigs</h2>
<a href="#" style="font-size: 14px; font-weight: 600; color: #22E4FF; text-decoration: none;">See all</a>
</div>
<div style="display: flex; gap: 14px; margin: 14px -24px 0 0; overflow: hidden;">
<div style="flex: none; width: 150px; height: 120px; border-radius: 4px; background: radial-gradient(circle at 28% 18%, rgba(255,46,147,0.95), transparent 42%), radial-gradient(circle at 76% 12%, rgba(34,228,255,0.85), transparent 36%), linear-gradient(#24123d, #07050F); border: 9px solid #F5F1E8; border-bottom: 0; transform: rotate(-2deg);"></div>
<div style="flex: none; width: 150px; height: 120px; border-radius: 4px; background: linear-gradient(#FFB020, #FF2E93 52%, #2a0e3a); border: 9px solid #F5F1E8; border-bottom: 0; transform: rotate(1.5deg);"></div>
<div style="flex: none; width: 150px; height: 120px; border-radius: 4px; background: radial-gradient(circle at 50% 8%, rgba(122,162,255,0.95), transparent 48%), linear-gradient(#0d1235, #05030a); border: 9px solid #F5F1E8; border-bottom: 0; transform: rotate(-1deg);"></div>
</div>
</div>

<nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; height: 86px; box-sizing: border-box; padding: 8px 10px 22px; display: flex; align-items: flex-start; justify-content: space-around; background: rgba(9,7,18,0.94); border-top: 1px solid rgba(255,255,255,0.08);">
<a href="#" style="width: 64px; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #B6FF3B; text-decoration: none; font-size: 11.5px; font-weight: 600;"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20a6.5 6.5 0 0 1 13 0"></path><circle cx="17" cy="9" r="2.8"></circle><path d="M15.5 14.2A5.5 5.5 0 0 1 21.5 20"></path></svg>Crew</a>
<a href="#" style="width: 64px; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #D9D4EC; text-decoration: none; font-size: 11.5px; font-weight: 500;"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg>Map</a>
<a href="#" aria-label="Add" style="width: 64px; display: flex; justify-content: center; text-decoration: none;"><span style="width: 52px; height: 52px; margin-top: -6px; border-radius: 50%; background: linear-gradient(135deg, #FF2E93, #9D5CFF 60%, #22E4FF); box-shadow: 0 10px 26px -8px rgba(255,46,147,0.7); color: #FFFFFF; display: flex; align-items: center; justify-content: center;"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></span></a>
<a href="#" style="width: 64px; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #D9D4EC; text-decoration: none; font-size: 11.5px; font-weight: 500;"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3.5" width="14" height="17" rx="1.5"></rect><rect x="7.5" y="6" width="9" height="9" rx="0.5"></rect></svg>Story</a>
<a href="#" style="width: 64px; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #D9D4EC; text-decoration: none; font-size: 11.5px; font-weight: 500;"><img src="faces/me.png" alt="" style="display: block; width: 26px; height: 26px; border-radius: 50%;">Me</a>
</nav>
</div>
</body>
</html>
