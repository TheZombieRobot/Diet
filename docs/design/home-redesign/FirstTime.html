<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>First time</title>
<style>
@font-face{font-family:Inter;font-weight:400;src:url(../../../app/src/main/res/font/inter_regular.ttf)}
@font-face{font-family:Inter;font-weight:500;src:url(../../../app/src/main/res/font/inter_medium.ttf)}
@font-face{font-family:Inter;font-weight:600 700;src:url(../../../app/src/main/res/font/inter_semibold.ttf)}
@font-face{font-family:Unbounded;font-weight:700;src:url(../../../app/src/main/res/font/unbounded_bold.ttf)}
@font-face{font-family:Unbounded;font-weight:800;src:url(../../../app/src/main/res/font/unbounded_extrabold.ttf)}
@font-face{font-family:'Permanent Marker';src:url(../../../app/src/main/res/font/permanent_marker.ttf)}

body{margin:0;background:#07050F}
a{color:#22E4FF}a:hover{color:#B6FF3B}
button{font:inherit}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: radial-gradient(60% 34% at 50% 30%, rgba(34,228,255,0.12), transparent 70%), radial-gradient(70% 45% at 100% 100%, rgba(255,46,147,0.12), transparent 70%), #07050F; color: #F7F5FF; font-family: Inter, system-ui, -apple-system, sans-serif;">

<div style="padding: 52px 24px 0; display: flex; flex-direction: column;">
<div style="display: flex; align-items: center; justify-content: space-between;">
<p style="margin: 0; font-family: Unbounded, 'Arial Black', sans-serif; font-weight: 800; font-size: 26px; letter-spacing: -0.5px;">mosh<span style="color: #FF2E93; text-shadow: 0 0 18px rgba(255,46,147,0.55);">point</span></p>
<button type="button" style="display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid rgba(255,111,179,0.45); background: rgba(255,46,147,0.08); color: #FF6FB3; font-size: 14px; font-weight: 600; cursor: pointer;"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7.5v5.5"></path><path d="M12 16.5h.01"></path></svg>Need help</button>
</div>
<div style="display: flex; align-items: center; gap: 10px; margin-top: 12px;">
<span style="font-family: Unbounded, 'Arial Black', sans-serif; font-weight: 700; font-size: 15px; color: #8E87A6;">Live</span>
<button type="button" aria-pressed="false" aria-label="Live" style="position: relative; width: 46px; height: 28px; border-radius: 14px; border: 0; padding: 0; background: rgba(255,255,255,0.16); cursor: pointer;"><span style="position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #D9D4EC;"></span></button>
<span style="font-size: 13.5px; color: #8E87A6;">Off: mates can't see you yet</span>
</div>

<div aria-hidden="true" style="position: relative; align-self: center; width: 200px; height: 200px; margin-top: 18px;">
<svg width="200" height="200" viewBox="0 0 240 240" fill="none">
<defs>
<linearGradient id="arrowFill" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#FFFFFF"></stop>
<stop offset="0.22" stop-color="#22E4FF"></stop>
<stop offset="1" stop-color="#9D5CFF"></stop>
</linearGradient>
</defs>
<circle cx="120" cy="120" r="112" stroke="rgba(34,228,255,0.12)" stroke-width="1.5"></circle>
<circle cx="120" cy="120" r="78" stroke="rgba(34,228,255,0.22)" stroke-width="1.5"></circle>
<circle cx="120" cy="120" r="44" stroke="rgba(34,228,255,0.38)" stroke-width="1.5"></circle>
<circle cx="120" cy="120" r="7" fill="#F7F5FF"></circle>
<path d="M120 52 L140 80 L126 80 L126 120 L114 120 L114 80 L100 80 Z" fill="url(#arrowFill)" transform="rotate(40 120 120)"></path>
</svg>
<img src="faces/sam.png" alt="" style="position: absolute; left: 130px; top: 6px; width: 46px; height: 46px; border-radius: 50%; box-shadow: 0 0 0 3px #B6FF3B, 0 0 18px 2px rgba(182,255,59,0.5);">
<span style="position: absolute; left: 132px; top: 58px; padding: 2px 8px; border-radius: 10px; background: rgba(182,255,59,0.14); color: #B6FF3B; font-family: Unbounded, 'Arial Black', sans-serif; font-weight: 700; font-size: 11px;">12 m</span>
</div>

<h1 style="margin: 14px 0 0; font-family: Unbounded, 'Arial Black', sans-serif; font-weight: 800; font-size: 27px; letter-spacing: -0.5px; line-height: 1.15; text-align: center;">Find your mates in the crowd</h1>
<p style="margin: 10px 0 0; font-size: 15px; line-height: 1.5; color: #D9D4EC; text-align: center;">Start a crew and your mates scan the QR code. A glowing arrow points to each of them, even with no signal.</p>

<button type="button" style="margin-top: 22px; height: 64px; border-radius: 20px; border: 0; display: flex; align-items: center; justify-content: center; gap: 12px; background: linear-gradient(90deg, #FF2E93, #9D5CFF 55%, #22E4FF); box-shadow: 0 16px 40px -14px rgba(255,46,147,0.65); color: #FFFFFF; font-family: Unbounded, 'Arial Black', sans-serif; font-weight: 700; font-size: 17px; cursor: pointer;"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="8" r="3.5"></circle><path d="M3.5 20a6.5 6.5 0 0 1 13 0"></path><path d="M19 8v6M16 11h6"></path></svg>Start a crew for tonight</button>

<div style="display: flex; gap: 12px; margin-top: 12px;">
<button type="button" style="flex: 1 1 0; min-width: 0; height: 52px; border-radius: 16px; border: 1px solid rgba(34,228,255,0.30); background: rgba(34,228,255,0.07); color: #22E4FF; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 600; cursor: pointer;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V5h4M20 9V5h-4M4 15v4h4M20 15v4h-4"></path><path d="M8 12h8"></path></svg>Scan QR code</button>
<button type="button" style="flex: 1 1 0; min-width: 0; height: 52px; border-radius: 16px; border: 1px solid rgba(34,228,255,0.30); background: rgba(34,228,255,0.07); color: #22E4FF; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 600; cursor: pointer;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"></path><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"></path></svg>Paste invite</button>
</div>
<button type="button" style="align-self: center; margin-top: 8px; height: 44px; padding: 0 12px; border: 0; background: none; color: #C9A8FF; font-size: 14px; font-weight: 600; cursor: pointer;">Plan a gig for another night</button>
</div>

<nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; height: 86px; box-sizing: border-box; padding: 8px 10px 22px; display: flex; align-items: flex-start; justify-content: space-around; background: rgba(9,7,18,0.94); border-top: 1px solid rgba(255,255,255,0.08);">
<a href="#" style="width: 64px; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #B6FF3B; text-decoration: none; font-size: 11.5px; font-weight: 600;"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20a6.5 6.5 0 0 1 13 0"></path><circle cx="17" cy="9" r="2.8"></circle><path d="M15.5 14.2A5.5 5.5 0 0 1 21.5 20"></path></svg>Crew</a>
<a href="#" style="width: 64px; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #D9D4EC; text-decoration: none; font-size: 11.5px; font-weight: 500;"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg>Map</a>
<a href="#" aria-label="Add" style="width: 64px; display: flex; justify-content: center; text-decoration: none;"><span style="width: 52px; height: 52px; margin-top: -6px; border-radius: 50%; background: linear-gradient(135deg, #FF2E93, #9D5CFF 60%, #22E4FF); box-shadow: 0 10px 26px -8px rgba(255,46,147,0.7); color: #FFFFFF; display: flex; align-items: center; justify-content: center;"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></span></a>
<a href="#" style="width: 64px; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #D9D4EC; text-decoration: none; font-size: 11.5px; font-weight: 500;"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3.5" width="14" height="17" rx="1.5"></rect><rect x="7.5" y="6" width="9" height="9" rx="0.5"></rect></svg>Story</a>
<a href="#" style="width: 64px; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #D9D4EC; text-decoration: none; font-size: 11.5px; font-weight: 500;"><img src="faces/me.png" alt="" style="display: block; width: 26px; height: 26px; border-radius: 50%;">Me</a>
</nav>
</div>
</body>
</html>
