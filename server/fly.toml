# Fly.io config for the Moshpoint relay server.
# From the repo root:
#   fly launch --config server/fly.toml --copy-config --no-deploy   (first time; pick an app name)
#   fly deploy --config server/fly.toml
# Then set the repo variable MOSHPOINT_SERVER to https://<app-name>.fly.dev
app = "moshpoint-relay"
primary_region = "syd" # closest to NZ

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  # Stops when idle (nobody polling), starts on the next request. The store is in
  # memory and only keeps 15 minutes of sealed locations, so nothing is lost that matters.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
