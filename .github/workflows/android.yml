name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Core + server tests
        run: ./gradlew :core:test :server:test --continue

      - name: Build debug APK
        if: success() || failure()
        shell: bash
        run: |
          set -o pipefail
          # GPS mode: set the repository variable MOSHPOINT_SERVER (Settings -> Secrets and
          # variables -> Actions -> Variables) to the relay server's https address.
          ./gradlew :app:assembleDebug --continue -Pmoshpoint.server="${{ vars.MOSHPOINT_SERVER }}" 2>&1 | tee build.log

      - name: Compile errors
        if: failure()
        run: |
          grep '^e: ' build.log | head -60 || true

      - name: Android lint (report only)
        if: success()
        continue-on-error: true
        shell: bash
        run: |
          ./gradlew :app:lintDebug -q || true
          echo "=== lint summary ==="
          grep -E '^[^ ].*: (Error|Warning): ' app/build/reports/lint.txt | sed -E 's/.*: (Error|Warning): .*\[([A-Za-z]+)\]$/\1 \2/' | sort | uniq -c | sort -rn || true
          echo "=== errors and key warnings ==="
          grep -E ': Error: |\[(NewApi|MissingPermission|InlinedApi|UnspecifiedRegisterReceiverFlag|WrongConstant|ForegroundServiceType|MissingSuperCall)\]' app/build/reports/lint.txt | head -80 || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: moshpoint-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/lint*
            core/build/reports
            server/build/reports
            app/build/reports
