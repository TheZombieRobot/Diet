name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Core + server tests
        run: ./gradlew :core:test :server:test --continue

      - name: Build debug APK
        if: success() || failure()
        run: ./gradlew :app:assembleDebug --continue 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      - name: Compile errors
        if: failure()
        run: grep -E '^(e|w): ' build.log | grep '^e:' | head -50 || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: moshpoint-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            core/build/reports
            server/build/reports
            app/build/reports
