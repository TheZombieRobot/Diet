name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Queue rather than cancel: every pushed build reports, even when pushes are close together.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # to commit updated screenshots back to this branch
    env:
      HAS_KEYSTORE: ${{ secrets.MOSHPOINT_KEYSTORE != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Core + server tests
        run: ./gradlew :core:test :server:test --continue

      - name: Build debug APK
        if: success() || failure()
        shell: bash
        run: |
          set -o pipefail
          # GPS mode: set the repository variable MOSHPOINT_SERVER (Settings -> Secrets and
          # variables -> Actions -> Variables) to the relay server's https address.
          ./gradlew :app:assembleDebug --continue -Pmoshpoint.server="${{ vars.MOSHPOINT_SERVER }}" -Pmoshpoint.facebookAppId="${{ vars.MOSHPOINT_FACEBOOK_APP_ID }}" -Pmoshpoint.facebookClientToken="${{ vars.MOSHPOINT_FACEBOOK_CLIENT_TOKEN }}" 2>&1 | tee build.log

      - name: Release build (R8 shrinking, debug mode stripped)
        if: success()
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease --continue -Pmoshpoint.server="${{ vars.MOSHPOINT_SERVER }}" -Pmoshpoint.facebookAppId="${{ vars.MOSHPOINT_FACEBOOK_APP_ID }}" -Pmoshpoint.facebookClientToken="${{ vars.MOSHPOINT_FACEBOOK_CLIENT_TOKEN }}" 2>&1 | tee -a build.log
          # Debug-only code must not ship. Class names are obfuscated, so look for text
          # that only the debug panel and simulator use.
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          leaked=0
          for s in 'solo = only this one' 'Debug: add simulated friend' 'Mark ground truth' 'Hide debug'; do
            if unzip -p "$APK" 'classes*.dex' | grep -a -q "$s"; then
              echo "::error::debug-only text '$s' found in release APK"
              leaked=1
            else
              echo "OK: '$s' not in release APK"
            fi
          done
          exit $leaked

      - name: Signed Play Store bundle (only when signing secrets are set)
        if: success() && env.HAS_KEYSTORE == 'true'
        shell: bash
        env:
          MOSHPOINT_KEYSTORE_PASSWORD: ${{ secrets.MOSHPOINT_KEYSTORE_PASSWORD }}
          MOSHPOINT_KEY_ALIAS: ${{ secrets.MOSHPOINT_KEY_ALIAS }}
          MOSHPOINT_KEY_PASSWORD: ${{ secrets.MOSHPOINT_KEY_PASSWORD }}
          KEYSTORE_B64: ${{ secrets.MOSHPOINT_KEYSTORE }}
          SERVER_URL: ${{ vars.MOSHPOINT_SERVER }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          MOSHPOINT_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks" ./gradlew :app:bundleRelease -Pmoshpoint.server="$SERVER_URL" -Pmoshpoint.facebookAppId="${{ vars.MOSHPOINT_FACEBOOK_APP_ID }}" -Pmoshpoint.facebookClientToken="${{ vars.MOSHPOINT_FACEBOOK_CLIENT_TOKEN }}"
          rm -f "$RUNNER_TEMP/upload.jks"

      - name: Upload Play Store bundle
        if: success() && env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: moshpoint-release-aab
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Compile errors
        if: failure()
        run: |
          grep '^e: ' build.log | head -60 || true

      - name: Screenshots of every screen (Paparazzi, no phone needed)
        if: success()
        continue-on-error: true
        shell: bash
        run: |
          ./gradlew :app:recordPaparazziDebug -q || {
            echo "=== failing screenshot tests ==="
            grep -h -B1 -A8 "<failure" app/build/test-results/*/*.xml | head -60
            exit 1
          }

      - name: Commit screenshots to docs/screenshots (only when they change)
        if: success() && github.event_name == 'push'
        continue-on-error: true
        shell: bash
        run: |
          [ -n "$(ls app/src/test/snapshots/images/*.png 2>/dev/null)" ] || exit 0
          mkdir -p docs/screenshots
          rm -f docs/screenshots/*.png
          for f in app/src/test/snapshots/images/*.png; do
            # Paparazzi names files <package>_<Class>_<test>.png; keep just the test name.
            cp "$f" "docs/screenshots/$(basename "$f" | sed -E 's/.*_([^_]+\.png)$/\1/')"
          done
          git add docs/screenshots
          if git diff --cached --quiet; then echo "Screenshots unchanged"; exit 0; fi
          git config user.name "moshpoint-ci"
          git config user.email "moshpoint-ci@users.noreply.github.com"
          git commit -m "Update screenshots for ${GITHUB_SHA::7} [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload screenshots
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: app/src/test/snapshots/images/*.png
          retention-days: 14
          if-no-files-found: warn

      - name: Android lint (report only)
        if: success()
        continue-on-error: true
        shell: bash
        run: |
          ./gradlew :app:lintDebug -q || true
          echo "=== lint summary ==="
          grep -E '^[^ ].*: (Error|Warning): ' app/build/reports/lint.txt | sed -E 's/.*: (Error|Warning): .*\[([A-Za-z]+)\]$/\1 \2/' | sort | uniq -c | sort -rn || true
          echo "=== errors and key warnings ==="
          grep -E ': Error: |\[(NewApi|MissingPermission|InlinedApi|UnspecifiedRegisterReceiverFlag|WrongConstant|ForegroundServiceType|MissingSuperCall)\]' app/build/reports/lint.txt | head -80 || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: moshpoint-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Publish test APK to a public link
        # Fixed URL anyone can open on their phone, no GitHub login:
        # https://github.com/TheZombieRobot/Diet/releases/download/testing/moshpoint.apk
        if: github.event_name == 'push' && github.ref_name == 'ccr-5839ed7c-1q0ztj'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/*.apk moshpoint.apk
          gh release view testing >/dev/null 2>&1 || gh release create testing --prerelease --target "$GITHUB_SHA" --title "Moshpoint test build" --notes "Test build"
          gh release upload testing moshpoint.apk --clobber
          sed "s/BUILD_NUMBER/$GITHUB_RUN_NUMBER/; s/BUILD_SHA/${GITHUB_SHA::7}/" .github/testing-release.md > notes.md
          gh release edit testing --title "Moshpoint (test build $GITHUB_RUN_NUMBER)" --notes-file notes.md

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/lint*
            core/build/reports
            server/build/reports
            app/build/reports
