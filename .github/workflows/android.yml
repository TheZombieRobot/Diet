name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Queue rather than cancel: every pushed build reports, even when pushes are close together.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # to commit updated screenshots back to this branch
    env:
      HAS_KEYSTORE: ${{ secrets.MOSHPOINT_KEYSTORE != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Download Gradle (mirrors or pieces if GitHub's file host is down; checksum-verified)
        shell: bash
        run: |
          set +e
          if ./gradlew --version -q; then exit 0; fi
          set -x
          # Whole-file downloads 504 during GitHub incidents; small ranged requests still work.
          # Fetch in 8 MB pieces, check the official checksum, then point the wrapper at the file.
          URL=$(grep distributionUrl gradle/wrapper/gradle-wrapper.properties | cut -d= -f2 | sed 's#\\:#:#')
          NAME=$(basename "$URL")
          REAL="https://github.com/gradle/gradle-distributions/releases/download/v$(echo "$NAME" | sed -E 's/gradle-(.*)-bin.zip/\1/')/$NAME"
          SHA=$(curl -fsSL --retry 5 "$URL.sha256" || curl -fsSL --retry 5 -r 0-200 "$REAL.sha256")
          [ -n "$SHA" ] || { echo "no checksum"; exit 1; }
          OUT="$RUNNER_TEMP/$NAME"; : > "$OUT"
          # Try Gradle's mirrors first (whole file), then GitHub in pieces. The checksum check
          # below means a bad or tampered mirror can't get through.
          for M in "https://downloads.gradle-dn.com/distributions/$NAME" "https://mirrors.cloud.tencent.com/gradle/$NAME" "https://mirrors.huaweicloud.com/gradle/$NAME"; do
            if curl -fsSL --retry 3 -m 600 -o "$OUT" "$M" && echo "$SHA  $OUT" | sha256sum -c -; then
              sed -i "s#^distributionUrl=.*#distributionUrl=file\\:$OUT#" gradle/wrapper/gradle-wrapper.properties
              ./gradlew --version -q && exit 0
            fi
          done
          : > "$OUT"
          SIZE=$(curl -sSL -r 0-0 -D - -o /dev/null --retry 5 "$REAL" | grep -i '^content-range' | tail -1 | sed -E 's#.*/([0-9]+).*#\1#')
          echo "Gradle is $SIZE bytes"
          [ -n "$SIZE" ] || exit 1
          CHUNK=8388608; START=0
          while [ "$START" -lt "$SIZE" ]; do
            END=$((START + CHUNK - 1))
            ok=0
            for t in 1 2 3 4 5 6 7 8; do
              if curl -fsSL -r "$START-$END" -o "$RUNNER_TEMP/part" "$REAL"; then ok=1; break; fi
              echo "piece at $START failed (try $t)"; sleep $((t * 5))
            done
            [ "$ok" = 1 ] || exit 1
            cat "$RUNNER_TEMP/part" >> "$OUT"
            START=$((END + 1))
          done
          echo "$SHA  $OUT" | sha256sum -c - || exit 1
          sed -i "s#^distributionUrl=.*#distributionUrl=file\\:$OUT#" gradle/wrapper/gradle-wrapper.properties
          ./gradlew --version -q

      - name: Translations match English (every language)
        run: |
          # Same strings, placeholders and plurals as English, and valid XML, in every language.
          # The phone app and the watch app (wear) both, each against its own English files.
          fail=0
          for d in app/src/main/res/values-*/ wear/src/main/res/values-*/; do
            ls "$d"strings*.xml >/dev/null 2>&1 || continue
            out=$(python3 tools/check_translation.py "$d") || { echo "::error::translation problems in $d"; echo "$out"; fail=1; }
          done
          # And the watch speaks exactly the languages the phone does.
          out=$(python3 tools/check_translation.py --same-languages app/src/main/res wear/src/main/res) || { echo "::error::the phone and the watch are translated into different languages"; echo "$out"; fail=1; }
          exit $fail

      - name: Core + server tests
        run: ./gradlew :core:test :server:test --continue

      - name: Build debug APK
        if: success() || failure()
        shell: bash
        env:
          MOSHPOINT_KEYSTORE_PASSWORD: ${{ secrets.MOSHPOINT_KEYSTORE_PASSWORD }}
          MOSHPOINT_KEY_ALIAS: ${{ secrets.MOSHPOINT_KEY_ALIAS }}
          MOSHPOINT_KEY_PASSWORD: ${{ secrets.MOSHPOINT_KEY_PASSWORD }}
          KEYSTORE_B64: ${{ secrets.MOSHPOINT_KEYSTORE }}
        run: |
          set -o pipefail
          # Test builds are signed with the private key when it's set up (never stored in the repo).
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            export MOSHPOINT_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks"
          fi
          # GPS mode: set the repository variable MOSHPOINT_SERVER (Settings -> Secrets and
          # variables -> Actions -> Variables) to the relay server's https address.
          ./gradlew :app:assembleDebug --continue -Pmoshpoint.server="${{ vars.MOSHPOINT_SERVER }}" -Pmoshpoint.facebookAppId="${{ vars.MOSHPOINT_FACEBOOK_APP_ID }}" -Pmoshpoint.facebookClientToken="${{ vars.MOSHPOINT_FACEBOOK_CLIENT_TOKEN }}" 2>&1 | tee build.log

      - name: Release build (R8 shrinking, debug mode stripped)
        if: success()
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease --continue -Pmoshpoint.server="${{ vars.MOSHPOINT_SERVER }}" -Pmoshpoint.facebookAppId="${{ vars.MOSHPOINT_FACEBOOK_APP_ID }}" -Pmoshpoint.facebookClientToken="${{ vars.MOSHPOINT_FACEBOOK_CLIENT_TOKEN }}" 2>&1 | tee -a build.log
          # Debug-only code must not ship. Class names are obfuscated, so look for text
          # that only the debug panel and simulator use.
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          leaked=0
          for s in 'solo = only this one' 'Debug: add simulated friend' 'Mark ground truth' 'Hide debug' 'Force no internet'; do
            if unzip -p "$APK" 'classes*.dex' | grep -a -q "$s"; then
              echo "::error::debug-only text '$s' found in release APK"
              leaked=1
            else
              echo "OK: '$s' not in release APK"
            fi
          done
          exit $leaked

      - name: Licences of every library in the app (shown in Settings)
        if: success()
        shell: bash
        run: |
          # Every library shipped must come with a licence the app can show; fail otherwise.
          F=$(find app/build -path '*release*' -name aboutlibraries.json | head -1)
          [ -n "$F" ] || { echo "::error::licence list (aboutlibraries.json) was not generated"; exit 1; }
          python3 - "$F" <<'PY'
          import json, sys, collections
          d = json.load(open(sys.argv[1]))
          libs, lic = d.get("libraries", []), d.get("licenses", {})
          print(f"{len(libs)} libraries")
          count = collections.Counter(l for x in libs for l in x.get("licenses", []))
          bundled = ("facebook-android-sdk", "libyuv")  # texts shipped in assets/licenses/third-party
          for k, n in count.most_common():
              v = lic.get(k, {})
              url = str(v.get("url"))
              how = "full text" if v.get("content") else ("text bundled in app" if any(b in url for b in bundled) else "link: " + url)
              print(f"  {n:3}  {v.get('name', k)}  ({how})")
          bare = [x.get("uniqueId") for x in libs if not x.get("licenses")]
          for b in bare: print(f"::warning::no licence found for {b}")
          PY

      - name: Signed Play Store bundle (only when signing secrets are set)
        if: success() && env.HAS_KEYSTORE == 'true'
        shell: bash
        env:
          MOSHPOINT_KEYSTORE_PASSWORD: ${{ secrets.MOSHPOINT_KEYSTORE_PASSWORD }}
          MOSHPOINT_KEY_ALIAS: ${{ secrets.MOSHPOINT_KEY_ALIAS }}
          MOSHPOINT_KEY_PASSWORD: ${{ secrets.MOSHPOINT_KEY_PASSWORD }}
          KEYSTORE_B64: ${{ secrets.MOSHPOINT_KEYSTORE }}
          SERVER_URL: ${{ vars.MOSHPOINT_SERVER }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          MOSHPOINT_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks" ./gradlew :app:bundleRelease -Pmoshpoint.server="$SERVER_URL" -Pmoshpoint.facebookAppId="${{ vars.MOSHPOINT_FACEBOOK_APP_ID }}" -Pmoshpoint.facebookClientToken="${{ vars.MOSHPOINT_FACEBOOK_CLIENT_TOKEN }}"
          rm -f "$RUNNER_TEMP/upload.jks"

      - name: Upload Play Store bundle
        if: success() && env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: moshpoint-release-aab
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Compile errors
        if: failure()
        run: |
          grep '^e: ' build.log | head -60 || true

      - name: Screenshots of every screen (Paparazzi, no phone needed)
        if: success()
        continue-on-error: true
        shell: bash
        run: |
          ./gradlew :app:recordPaparazziDebug -q || {
            echo "=== failing screenshot tests ==="
            grep -h -B1 -A8 "<failure" app/build/test-results/*/*.xml | head -60
            exit 1
          }

      - name: Commit screenshots to docs/screenshots (only when they change)
        if: success() && github.event_name == 'push'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -n "$(ls app/src/test/snapshots/images/*.png 2>/dev/null)" ] || exit 0
          mkdir -p docs/screenshots
          rm -f docs/screenshots/*.png
          # Paparazzi names files <package>_<Class>_<test>.png.
          #   ...ScreensSnapshotTest_home.png -> home.png (English)
          #   ...Lang_de_home.png -> de-home.png, ...Lang_zh_rTW_home.png -> zh-rTW-home.png
          # docs/screenshots keeps English plus German, Arabic, Japanese and US; every language
          # goes to the ui-screenshots branch (replaced each run, so history stays small).
          ALL="$RUNNER_TEMP/ui-shots"; rm -rf "$ALL"; mkdir -p "$ALL"
          for f in app/src/test/snapshots/images/*.png; do
            base=$(basename "$f")
            if [[ "$base" =~ _Lang_([a-z]+)(_r[A-Z]+)?_(.+\.png)$ ]]; then
              lang="${BASH_REMATCH[1]}${BASH_REMATCH[2]/_r/-r}"; test="${BASH_REMATCH[3]}"
            else
              lang="en"; test=$(echo "$base" | sed -E 's/.*_([^_]+\.png)$/\1/')
            fi
            mkdir -p "$ALL/$lang" && cp "$f" "$ALL/$lang/$test"
            case "$lang" in
              en) cp "$f" "docs/screenshots/$test" ;;
              de|ar|ja|en-rUS) cp "$f" "docs/screenshots/$lang-$test" ;;
            esac
          done
          (
            cd "$ALL" && git init -q && git checkout -q -b ui-screenshots && git add . &&
            git -c user.name=moshpoint-ci -c user.email=moshpoint-ci@users.noreply.github.com commit -qm "UI screenshots, every language, for ${GITHUB_SHA::7}" &&
            git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ui-screenshots
          ) || echo "Couldn't publish the all-language screenshots"
          git add docs/screenshots
          if git diff --cached --quiet; then echo "Screenshots unchanged"; exit 0; fi
          git config user.name "moshpoint-ci"
          git config user.email "moshpoint-ci@users.noreply.github.com"
          git commit -m "Update screenshots for ${GITHUB_SHA::7} [skip ci]"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload screenshots
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: app/src/test/snapshots/images/*.png
          retention-days: 14
          if-no-files-found: warn

      - name: Android lint (report only)
        if: success()
        continue-on-error: true
        shell: bash
        run: |
          ./gradlew :app:lintDebug -q || true
          echo "=== lint summary ==="
          grep -E '^[^ ].*: (Error|Warning): ' app/build/reports/lint.txt | sed -E 's/.*: (Error|Warning): .*\[([A-Za-z]+)\]$/\1 \2/' | sort | uniq -c | sort -rn || true
          echo "=== errors and key warnings ==="
          grep -E ': Error: |\[(NewApi|MissingPermission|InlinedApi|UnspecifiedRegisterReceiverFlag|WrongConstant|ForegroundServiceType|MissingSuperCall)\]' app/build/reports/lint.txt | head -80 || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: moshpoint-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Publish test APK to a public link
        # Fixed URL anyone can open on their phone, no GitHub login.
        # If the RELEASES_TOKEN secret is set, builds go to the separate public repo
        # TheZombieRobot/moshpoint-builds (code can then stay private); otherwise to this repo.
        if: github.event_name == 'push' && github.ref_name == 'ccr-5839ed7c-1q0ztj'
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN || github.token }}
          TARGET: ${{ secrets.RELEASES_TOKEN != '' && 'TheZombieRobot/moshpoint-builds' || github.repository }}
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/*.apk moshpoint.apk
          gh release view testing --repo "$TARGET" >/dev/null 2>&1 || gh release create testing --repo "$TARGET" --prerelease --title "Moshpoint test build" --notes "Test build"
          gh release upload testing moshpoint.apk --clobber --repo "$TARGET"
          sed "s/BUILD_NUMBER/$GITHUB_RUN_NUMBER/; s/BUILD_SHA/${GITHUB_SHA::7}/" .github/testing-release.md > notes.md
          gh release edit testing --repo "$TARGET" --title "Moshpoint (test build $GITHUB_RUN_NUMBER)" --notes-file notes.md
          echo "Published to https://github.com/$TARGET/releases/tag/testing"

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/lint*
            core/build/reports
            server/build/reports
            app/build/reports

  # ---- The Wear OS companion (wear/, docs/WATCH.md). Its own job, on its own runner, so the
  # phone build above is neither slowed down nor changed. ----
  wear:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # to commit updated watch screenshots back to this branch
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Download Gradle (mirrors or pieces if GitHub's file host is down; checksum-verified)
        shell: bash
        run: |
          set +e
          if ./gradlew --version -q; then exit 0; fi
          set -x
          # Whole-file downloads 504 during GitHub incidents; small ranged requests still work.
          # Fetch in 8 MB pieces, check the official checksum, then point the wrapper at the file.
          URL=$(grep distributionUrl gradle/wrapper/gradle-wrapper.properties | cut -d= -f2 | sed 's#\\:#:#')
          NAME=$(basename "$URL")
          REAL="https://github.com/gradle/gradle-distributions/releases/download/v$(echo "$NAME" | sed -E 's/gradle-(.*)-bin.zip/\1/')/$NAME"
          SHA=$(curl -fsSL --retry 5 "$URL.sha256" || curl -fsSL --retry 5 -r 0-200 "$REAL.sha256")
          [ -n "$SHA" ] || { echo "no checksum"; exit 1; }
          OUT="$RUNNER_TEMP/$NAME"; : > "$OUT"
          # Try Gradle's mirrors first (whole file), then GitHub in pieces. The checksum check
          # below means a bad or tampered mirror can't get through.
          for M in "https://downloads.gradle-dn.com/distributions/$NAME" "https://mirrors.cloud.tencent.com/gradle/$NAME" "https://mirrors.huaweicloud.com/gradle/$NAME"; do
            if curl -fsSL --retry 3 -m 600 -o "$OUT" "$M" && echo "$SHA  $OUT" | sha256sum -c -; then
              sed -i "s#^distributionUrl=.*#distributionUrl=file\\:$OUT#" gradle/wrapper/gradle-wrapper.properties
              ./gradlew --version -q && exit 0
            fi
          done
          : > "$OUT"
          SIZE=$(curl -sSL -r 0-0 -D - -o /dev/null --retry 5 "$REAL" | grep -i '^content-range' | tail -1 | sed -E 's#.*/([0-9]+).*#\1#')
          echo "Gradle is $SIZE bytes"
          [ -n "$SIZE" ] || exit 1
          CHUNK=8388608; START=0
          while [ "$START" -lt "$SIZE" ]; do
            END=$((START + CHUNK - 1))
            ok=0
            for t in 1 2 3 4 5 6 7 8; do
              if curl -fsSL -r "$START-$END" -o "$RUNNER_TEMP/part" "$REAL"; then ok=1; break; fi
              echo "piece at $START failed (try $t)"; sleep $((t * 5))
            done
            [ "$ok" = 1 ] || exit 1
            cat "$RUNNER_TEMP/part" >> "$OUT"
            START=$((END + 1))
          done
          echo "$SHA  $OUT" | sha256sum -c - || exit 1
          sed -i "s#^distributionUrl=.*#distributionUrl=file\\:$OUT#" gradle/wrapper/gradle-wrapper.properties
          ./gradlew --version -q

      - name: Build watch debug APK
        shell: bash
        env:
          MOSHPOINT_KEYSTORE_PASSWORD: ${{ secrets.MOSHPOINT_KEYSTORE_PASSWORD }}
          MOSHPOINT_KEY_ALIAS: ${{ secrets.MOSHPOINT_KEY_ALIAS }}
          MOSHPOINT_KEY_PASSWORD: ${{ secrets.MOSHPOINT_KEY_PASSWORD }}
          KEYSTORE_B64: ${{ secrets.MOSHPOINT_KEYSTORE }}
        run: |
          set -o pipefail
          # Signed exactly like the phone's test build (the private key when it's set up, else
          # the public debug key): the Wear Data Layer only links apps signed with the same key.
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            export MOSHPOINT_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks"
          fi
          ./gradlew :wear:assembleDebug --continue 2>&1 | tee wear-build.log

      - name: Watch release build (R8 shrinking)
        if: success()
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :wear:assembleRelease --continue 2>&1 | tee -a wear-build.log

      - name: Watch APK pairs with the phone app (same app id, watch-only)
        if: success()
        shell: bash
        run: |
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          for APK in wear/build/outputs/apk/debug/*.apk wear/build/outputs/apk/release/*.apk; do
            "$AAPT" dump badging "$APK" > badging.txt
            grep -q "^package: name='nz.waveformlabs.moshpoint' " badging.txt || { echo "::error::$APK must use the phone app's application id"; exit 1; }
            grep -q "uses-feature: name='android.hardware.type.watch'" badging.txt || { echo "::error::$APK is not marked as a watch app"; exit 1; }
            echo "OK: $APK ($(du -h "$APK" | cut -f1)) $(grep -o "sdkVersion:'[0-9]*'" badging.txt) $(grep -o "targetSdkVersion:'[0-9]*'" badging.txt)"
          done

      - name: Compile errors
        if: failure()
        run: |
          grep '^e: ' wear-build.log | head -80 || true

      - name: Watch screenshots, small and large round, every language (Paparazzi)
        if: success()
        shell: bash
        run: |
          ./gradlew :wear:recordPaparazziDebug -q || {
            echo "=== failing watch screenshot tests ==="
            grep -h -B1 -A12 "<failure\|<error" wear/build/test-results/*/*.xml | head -120
            exit 1
          }
          echo "$(ls wear/src/test/snapshots/images/*.png | wc -l) watch screenshots"

      - name: Commit watch screenshots to docs/screenshots/watch (only when they change)
        if: success() && github.event_name == 'push'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -n "$(ls wear/src/test/snapshots/images/*.png 2>/dev/null)" ] || exit 0
          mkdir -p docs/screenshots/watch
          rm -f docs/screenshots/watch/*.png
          # Paparazzi names files <package>_WatchScreensTest_<screen>[<language>_<size>].png.
          # docs/screenshots/watch keeps English (both sizes) plus German, Thai, Arabic and
          # Japanese on the small watch; every language and size goes to the
          # ui-screenshots-watch branch (replaced each run, so history stays small).
          ALL="$RUNNER_TEMP/watch-shots"; rm -rf "$ALL"; mkdir -p "$ALL"
          for f in wear/src/test/snapshots/images/*.png; do
            base=$(basename "$f")
            [[ "$base" =~ _WatchScreensTest_([A-Za-z0-9]+)\[([A-Za-z-]+)_(small|large)\]\.png$ ]] || continue
            screen="${BASH_REMATCH[1]}"; lang="${BASH_REMATCH[2]}"; size="${BASH_REMATCH[3]}"
            mkdir -p "$ALL/$lang" && cp "$f" "$ALL/$lang/$screen-$size.png"
            case "$lang" in
              en) cp "$f" "docs/screenshots/watch/$screen-$size.png" ;;
              de|th|ar|ja) [ "$size" = small ] && cp "$f" "docs/screenshots/watch/$lang-$screen.png" ;;
            esac
          done
          (
            cd "$ALL" && git init -q && git checkout -q -b ui-screenshots-watch && git add . &&
            git -c user.name=moshpoint-ci -c user.email=moshpoint-ci@users.noreply.github.com commit -qm "Watch screenshots, every language, for ${GITHUB_SHA::7}" &&
            git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ui-screenshots-watch
          ) || echo "Couldn't publish the all-language watch screenshots"
          git add docs/screenshots/watch
          if git diff --cached --quiet; then echo "Watch screenshots unchanged"; exit 0; fi
          git config user.name "moshpoint-ci"
          git config user.email "moshpoint-ci@users.noreply.github.com"
          git commit -m "Update watch screenshots for ${GITHUB_SHA::7} [skip ci]"
          # The phone job may be committing its own screenshots at the same moment: try a few times.
          for attempt in 1 2 3 4; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep $((attempt * 7))
          done

      - name: Upload watch screenshots
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: watch-screenshots
          path: wear/src/test/snapshots/images/*.png
          retention-days: 14
          if-no-files-found: warn

      - name: Watch lint (report only)
        if: success()
        continue-on-error: true
        shell: bash
        run: |
          ./gradlew :wear:lintDebug -q || true
          echo "=== lint summary ==="
          grep -E '^[^ ].*: (Error|Warning): ' wear/build/reports/lint.txt | sed -E 's/.*: (Error|Warning): .*\[([A-Za-z]+)\]$/\1 \2/' | sort | uniq -c | sort -rn || true
          echo "=== errors and key warnings ==="
          grep -E ': Error: |\[(NewApi|MissingPermission|InlinedApi|WrongConstant|ForegroundServiceType|MissingSuperCall|WearStandaloneAppFlag)\]' wear/build/reports/lint.txt | head -80 || true

      - name: Upload watch APK
        uses: actions/upload-artifact@v4
        with:
          name: moshpoint-watch-debug-apk
          path: wear/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Publish watch test APK next to the phone one
        # Same rule and same place as "Publish test APK to a public link" above.
        if: github.event_name == 'push' && github.ref_name == 'ccr-5839ed7c-1q0ztj'
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN || github.token }}
          TARGET: ${{ secrets.RELEASES_TOKEN != '' && 'TheZombieRobot/moshpoint-builds' || github.repository }}
        shell: bash
        run: |
          cp wear/build/outputs/apk/debug/*.apk moshpoint-watch.apk
          gh release view testing --repo "$TARGET" >/dev/null 2>&1 || gh release create testing --repo "$TARGET" --prerelease --title "Moshpoint test build" --notes "Test build"
          gh release upload testing moshpoint-watch.apk --clobber --repo "$TARGET"
          echo "Published to https://github.com/$TARGET/releases/download/testing/moshpoint-watch.apk"

      - name: Upload watch reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: watch-reports
          path: |
            wear/build/reports
            wear/build/test-results
