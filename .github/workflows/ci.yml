name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
  # No tool may send usage telemetry from CI (HEALTH_SAFETY.md section 7).
  DO_NOT_TRACK: '1'
  WRANGLER_SEND_METRICS: 'false'

# Every job runs on Ubuntu 24.04, named exactly: the browser tests' Playwright 1.56 has no
# Chromium build for Ubuntu 26.04, which `ubuntu-latest` became in October 2026 and which
# failed every browser-test job and the week-1 publish (tools/scans/workflows.test.ts).
jobs:
  check:
    name: Safety scans, lint, typecheck, unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: the safety scan checks every commit, not just the latest one.
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          # pnpm is enabled by corepack in the next step, so it cannot be cached yet.
          package-manager-cache: false
      - name: Enable pnpm (version pinned in package.json)
        run: corepack enable
      - run: pnpm install --frozen-lockfile
      # First, so a privacy failure is reported even if a later step would fail.
      - name: Static safety scans (health wording, prices, personal data and history, network, licences)
        run: pnpm scan
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  e2e:
    name: Browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Default shallow checkout: browser tests do not need history.
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          # pnpm is enabled by corepack in the next step, so it cannot be cached yet.
          package-manager-cache: false
      - name: Enable pnpm (version pinned in package.json)
        run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium
      # The Playwright web server builds the phone app, then serves it with `vite preview`
      # (playwright.config.ts), so the tests always run against a fresh production build.
      - run: pnpm e2e
      # The report and traces of a failed run, for a week. The tests use synthetic data only.
      - name: Keep the browser test report when a test fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
