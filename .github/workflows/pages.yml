name: Deploy phone app to GitHub Pages

# Publishes apps/mobile-web to https://thezombierobot.github.io/Diet/ (checklist item 5).
#
# Publishing is deliberate. A push to a work branch (named ccr-...) publishes only when the
# subject line (the first line) of its head commit message contains "[deploy]"; the marker in a
# commit's body does not count (full review F43). Any other push runs only the marker job, which
# says in its summary that nothing was published. Every push to a work branch starts this
# workflow, a docs-only one too: a path filter here once meant that a docs-only "[deploy]" push
# started no run at all and published nothing, with nothing to say so (full review F42). "Run
# workflow" by hand also publishes, but GitHub offers it only for workflows on the default
# branch, which holds the plan.
#
# Nothing is published until the build job has passed the same checks as CI: `pnpm check` (safety
# scans, lint, type check, unit tests) and the full browser suite, `pnpm e2e`, which includes the
# network audit online and offline, the Content Security Policy checks, Chrome's installability
# check, the offline tests and the check that the built service worker fetches nothing from any
# other origin. After the deploy, the verify job runs the browser checks again on the live site.
#
# Pages was turned on by the owner on 19 October 2026 (Settings > Pages > Source: GitHub Actions).
# The github-pages environment must also allow the work branch: Settings > Environments >
# github-pages > Deployment branches and tags > add the rule ccr-* (see README.md, "Phone app").
on:
  push:
    branches:
      - 'ccr-*'
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a deploy in progress is allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
  # No tool may send usage telemetry from CI (HEALTH_SAFETY.md section 7).
  DO_NOT_TRACK: '1'

# Every job runs on Ubuntu 24.04, named exactly: the browser tests' Playwright 1.56 has no
# Chromium build for Ubuntu 26.04, which `ubuntu-latest` became in October 2026 and which
# failed every browser-test job and the week-1 publish (tools/scans/workflows.test.ts).
jobs:
  marker:
    name: Is this run marked for publishing?
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      deploy: ${{ steps.marker.outputs.deploy }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts
      - id: marker
        name: Look for the deploy marker in the head commit's subject line
        env:
          EVENT: ${{ github.event_name }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: bash .github/scripts/deploy-marker.sh >> "$GITHUB_OUTPUT"
      - name: Say when nothing is published
        if: steps.marker.outputs.deploy != 'true'
        run: echo 'Not published - the head commit subject line has no deploy marker.' >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Check, test and build
    needs: marker
    # The deploy and verify jobs need this one, so they are skipped with it.
    if: needs.marker.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # The address the app lives under on GitHub Pages (also the browser tests' default).
      DIET_BASE: /Diet/
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: the safety scan checks every commit before anything is published.
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          # pnpm is enabled by corepack in the next step, so it cannot be cached yet.
          package-manager-cache: false
      - name: Enable pnpm (version pinned in package.json)
        run: corepack enable
      # Cross-item ruling 8: wording that awaits the owner's confirmation at the week-1 review
      # (STOP 17), such as item 28's C58 help-card lines, is never published. This step fails while
      # health.ts still marks any string that way; the commit recording the confirmation removes
      # the markers.
      - name: Hold wording that awaits the owner's confirmation
        run: node tools/release/wording-hold.ts
      - run: pnpm install --frozen-lockfile
      - name: Safety scans, lint, type check and unit tests
        run: pnpm check
      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium
      # The Playwright web server builds the app for /Diet/ and serves the production build. The
      # same build label as the published build below, so the tests run on the same files.
      - name: Browser tests (the full suite)
        run: DIET_BUILD_ID="${GITHUB_SHA::7}" pnpm e2e
      - name: Keep the browser test report when a test fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-build
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Build the phone app for /Diet/
        # The short commit is shown on the About screen next to the version.
        run: DIET_BUILD_ID="${GITHUB_SHA::7}" pnpm --filter @diet/mobile-web build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/mobile-web/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Only this job can publish to Pages or ask GitHub for a deployment token.
    permissions:
      pages: write
      id-token: write
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # PWA-01 as replaced by DOC_REVIEW C35, the network audit (HS-14, TR-11) and the shell checks,
  # run against the deployed HTTPS address: Chrome's installability check, the manifest and its
  # icons, service worker control, offline reload, requests only to the app's own origin, the
  # Content Security Policy with nothing blocked, the rendered-text scan, and no running in a frame.
  verify:
    name: Check the deployed app
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Enable pnpm (version pinned in package.json)
        run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser tests against https://thezombierobot.github.io/Diet/
        env:
          DIET_E2E_URL: ${{ needs.deploy.outputs.page_url }}
        run: pnpm exec playwright test e2e/pwa.spec.ts e2e/network.spec.ts e2e/rendered-text.spec.ts e2e/shell.spec.ts
      - name: Keep the browser test report when a test fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-deployed
          path: |
            playwright-report/
            test-results/
          retention-days: 7
